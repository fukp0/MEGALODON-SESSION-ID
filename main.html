<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝐌𝐄𝐆𝐀𝐋𝐎𝐃𝐎𝐍-𝐌𝐃 | Pair Code</title>
  <link rel="icon" type="image/jpg" href="https://files.catbox.moe/nzc6xk.jpg"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a080f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(168,85,255,0.18);
      --border-bright: rgba(168,85,255,0.55);
      --accent: #a855ff;
      --accent2: #ff2d9b;
      --text: #f0e8ff;
      --muted: rgba(240,232,255,0.45);
      --success: #00ffb3;
      --error: #ff4d6d;
      --glow: 0 0 20px rgba(168,85,255,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 16px; overflow-x: hidden;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 25%, rgba(168,85,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 75%, rgba(255,45,155,0.07) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(168,85,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--surface);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-radius: 20px; padding: 32px 28px;
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(168,85,255,0.05), 0 30px 80px rgba(0,0,0,0.65);
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .container::before, .container::after {
      content: ''; position: absolute;
      width: 20px; height: 20px;
      border-color: var(--accent); border-style: solid;
    }
    .container::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 20px 0 0 0; }
    .container::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 20px 0; }

    .header { text-align: center; margin-bottom: 28px; }

    .logo-wrap { position: relative; width: 80px; height: 80px; margin: 0 auto 16px; }

    .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--accent); border-top-color: var(--accent2);
      animation: spin 3s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .logo-img { position: absolute; inset: 6px; border-radius: 50%; object-fit: cover; }

    .logo-inner {
      position: absolute; inset: 6px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(168,85,255,0.15), rgba(255,45,155,0.15));
      display: none; align-items: center; justify-content: center;
      font-size: 26px; color: var(--accent);
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: 20px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

    .social-row { display: flex; justify-content: center; gap: 10px; margin: 18px 0 24px; }

    .social-row a {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .social-row a.yt { background: rgba(255,0,0,0.75); }
    .social-row a.tg { background: rgba(0,136,204,0.75); }
    .social-row a.wa { background: rgba(37,211,102,0.75); }
    .social-row a.gh { background: rgba(50,50,50,0.85); }
    .social-row a:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.4); }

    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border-bright), transparent); margin-bottom: 22px; }

    .input-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }

    .input-wrap { position: relative; margin-bottom: 16px; }

    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }

    .input-field {
      width: 100%; padding: 13px 14px 13px 40px;
      background: rgba(0,0,0,0.35); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }
    .input-field::placeholder { color: var(--muted); font-weight: 400; }
    .input-field:focus { border-color: var(--border-bright); box-shadow: var(--glow); }

    .generate-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 12px; color: #fff;
      font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700; letter-spacing: 2px;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; margin-bottom: 18px;
    }
    .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(168,85,255,0.35); }
    .generate-btn:active { transform: translateY(0); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .loading { display: none; text-align: center; padding: 10px 0; }
    .loader {
      display: inline-block; width: 28px; height: 28px;
      border: 2px solid rgba(168,85,255,0.15); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    .code-display {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; text-align: center; min-height: 52px;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
      font-family: 'Orbitron', monospace; font-size: 13px; color: var(--muted);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .code-display.has-code { border-color: rgba(0,255,179,0.35); box-shadow: 0 0 18px rgba(0,255,179,0.1); }

    .success-message { color: var(--success); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; letter-spacing: 1px; }
    .error-message { color: var(--error); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 0.5px; }

    .copy-btn {
      width: 100%; padding: 12px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; display: none; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; margin-bottom: 18px;
    }
    .copy-btn:hover { border-color: var(--border-bright); background: rgba(168,85,255,0.1); color: var(--accent); }

    .footer { text-align: center; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
    .footer span { color: var(--accent); font-weight: 600; }

    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; padding: 10px 22px; border-radius: 50px;
      font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 1px;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) { .container { padding: 24px 18px; } .title { font-size: 17px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <img class="logo-img" src="https://files.catbox.moe/nzc6xk.jpg" alt="logo"
          onerror="this.style.display='none';document.querySelector('.logo-inner').style.display='flex'"/>
        <div class="logo-inner"><i class="fas fa-robot"></i></div>
      </div>
      <h1 class="title">MEGALODON-MD</h1>
      <p class="subtitle">ᴘᴀɪʀ ᴄᴏᴅᴇ ʟɪɴᴋᴀɢᴇ</p>
      <div class="social-row">
        <a href="https://www.youtube.com/@dybytech00" target="_blank" class="yt"><i class="fab fa-youtube"></i></a>
        <a href="https://t.me/egdyby_tech" target="_blank" class="tg"><i class="fab fa-telegram-plane"></i></a>
        <a href="https://whatsapp.com/channel/0029VbAdcIXJP216dKW1253g" target="_blank" class="wa"><i class="fab fa-whatsapp"></i></a>
        <a href="https://github.com/DybyTech/MEGALODON-MD" target="_blank" class="gh"><i class="fab fa-github"></i></a>
      </div>
    </div>

    <div class="divider"></div>

    <label class="input-label">WhatsApp Number</label>
    <div class="input-wrap">
      <i class="fas fa-phone input-icon"></i>
      <input type="tel" id="mobileNumber" class="input-field" placeholder="509XXXXXXXX (with country code)"/>
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i>&nbsp; GENERATE PAIR CODE
    </button>

    <div class="loading" id="loading"><div class="loader"></div></div>

    <div class="code-display" id="codeDisplay">ʏᴏᴜʀ ᴄᴏᴅᴇ ᴡɪʟʟ ᴀᴘᴘᴇᴀʀ ʜᴇʀᴇ</div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-copy"></i> COPY CODE
    </button>

    <div class="footer">© 2025 <span>DYBY TECH</span> · MEGALODON-MD</div>
  </div>

  <div id="toast"><i class="fas fa-check"></i>&nbsp; Code copied!</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
  <script>
    document.getElementById("submit").addEventListener("click", async (e) => {
      e.preventDefault();
      const input     = document.getElementById("mobileNumber");
      const display   = document.getElementById("codeDisplay");
      const loading   = document.getElementById("loading");
      const copyBtn   = document.getElementById("copy");
      const submitBtn = document.getElementById("submit");
      const num = input.value.trim();

      if (!num) {
        display.className = "code-display";
        display.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Enter your WhatsApp number</div>';
        copyBtn.style.display = "none";
        return;
      }

      submitBtn.disabled = true;
      loading.style.display = "block";
      display.className = "code-display";
      display.innerHTML = '';
      copyBtn.style.display = "none";

      try {
        const res  = await axios(`/code?number=${num.replace(/[^0-9]/g, "")}`);
        const code = res.data.code || "Service Unavailable";
        loading.style.display = "none";
        if (code.includes("Unavailable") || code.startsWith("❗")) {
          display.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-circle"></i> ${code}</div>`;
        } else {
          display.className = "code-display has-code";
          display.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i>&nbsp;${code}</div>`;
          copyBtn.style.display = "flex";
        }
      } catch (err) {
        loading.style.display = "none";
        display.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Connection error. Try again.</div>';
      } finally {
        submitBtn.disabled = false;
      }
    });

    function copyCode() {
      const text = document.getElementById("codeDisplay").innerText.trim();
      const btn  = document.getElementById("copy");
      navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = '<i class="fas fa-check"></i> COPIED!';
        btn.disabled = true;
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => {
          btn.innerHTML = '<i class="fas fa-copy"></i> COPY CODE';
          btn.disabled = false;
          toast.classList.remove("show");
        }, 2000);
      });
    }

    document.getElementById("mobileNumber").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("submit").click();
    });
  </script>
</body>
</html>
